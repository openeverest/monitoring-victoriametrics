---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmpodscrapes
spec:
  description: |
    The controller claims the victoriametrics class and, for an Accepted
    ExtensionManaged binding, renders one VMPodScrape per component the
    Instance publishes metrics for; a component that stops publishing loses
    its VMPodScrape and deleting the binding garbage-collects the rest. Only
    CRDs are installed: the test publishes the Instance's monitoring sources
    the way provider-runtime would and creates the Instance-owned binding and
    accepts it the way core would.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,monitoringdestination,monitoringbinding,vmpodscrape -o yaml
    - script:
        content: kubectl get monitoringclass,provider -o yaml
    - podLogs:
        namespace: openeverest-system
        selector: app.kubernetes.io/name=monitoring-victoriametrics
        tail: 100
  steps:
    - name: class-claimed
      try:
        - assert:
            file: 00-assert.yaml

    # Stand in for provider-runtime: a multi-target engine exporter and a TLS
    # proxy endpoint behind the "metrics" credential profile.
    - name: instance-publishes-sources
      try:
        - apply:
            file: 10-install.yaml
        - script:
            content: |
              kubectl -n $NAMESPACE patch instance/vm-it --subresource status --type merge --patch "$(cat <<EOF
              {"status": {"monitoring": {"sources": {
                "identity": {"clusterId": "it", "labels": {
                  "openeverest_instance": "vm-it", "openeverest_namespace": "$NAMESPACE",
                  "openeverest_provider": "vm-it", "k8s_cluster_id": "it"}},
                "credentials": [{"profile": "metrics", "secretRef": {"name": "vm-it-monitoring-metrics"}}],
                "metrics": [
                  {"component": "engine", "kind": "mysql", "port": 9104, "path": "/probe", "scheme": "http",
                   "podSelector": {"core.openeverest.io/instance": "vm-it", "core.openeverest.io/component": "engine"},
                   "params": {"target": ["127.0.0.1:3306"]}},
                  {"component": "proxy", "kind": "haproxy", "port": "stats", "path": "/metrics", "scheme": "https",
                   "podSelector": {"core.openeverest.io/instance": "vm-it", "core.openeverest.io/component": "proxy"},
                   "tls": {"ca": {"secretKeyRef": {"name": "vm-it-tls", "key": "ca.crt"}}, "serverName": "vm-it-proxy"},
                   "auth": {"credentialProfile": "metrics"}}
                ]}}}}
              EOF
              )"

    - name: binding-accepted
      try:
        # Stand in for core's binding controller: the Instance owns the
        # binding, which is how Instance changes reach it.
        - script:
            content: |
              INSTANCE_UID=$(kubectl -n $NAMESPACE get instance/vm-it -o jsonpath='{.metadata.uid}')
              sed "s/__INSTANCE_UID__/$INSTANCE_UID/" 20-binding.yaml | kubectl -n $NAMESPACE apply -f -
        - script:
            content: |
              GENERATION=$(kubectl -n $NAMESPACE get monitoringbinding/vm-it-vm-ab1f7bf1 -o jsonpath='{.metadata.generation}')
              kubectl -n $NAMESPACE patch monitoringbinding/vm-it-vm-ab1f7bf1 --subresource status --type merge \
                -p '{"status":{"conditions":[{"type":"Accepted","status":"True","reason":"Accepted","message":"accepted by the test","observedGeneration":'"$GENERATION"',"lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
        - assert:
            file: 20-assert.yaml

    - name: component-stops-publishing
      try:
        # Reaches the binding through the Instance watch.
        - script:
            content: |
              kubectl -n $NAMESPACE patch instance/vm-it --subresource status --type merge --patch '{"status": {"monitoring": {"sources": {"metrics": [
                {"component": "engine", "kind": "mysql", "port": 9104, "path": "/probe", "scheme": "http",
                 "podSelector": {"core.openeverest.io/instance": "vm-it", "core.openeverest.io/component": "engine"},
                 "params": {"target": ["127.0.0.1:3306"]}}]}}}}'
        - assert:
            file: 30-assert.yaml
        - error:
            file: 30-errors.yaml

    - name: binding-removed
      try:
        - delete:
            ref:
              apiVersion: monitoring.openeverest.io/v1alpha1
              kind: MonitoringBinding
              name: vm-it-vm-ab1f7bf1
        - error:
            file: 40-errors.yaml
