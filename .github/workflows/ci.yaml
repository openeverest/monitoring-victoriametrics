---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC on the default branch.
    - cron: "0 3 * * *"

# Cancel in-progress runs for the same branch/PR when a new commit arrives.
# On main we let runs queue so every commit is validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile binary
        run: go build -o /dev/null ./cmd/controller

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test-unit

  tidy:
    name: Go modules tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod and go.sum are tidy
        run: make tidy-check

  copyright:
    name: Copyright headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful on PRs — push to main is already vetted.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check copyright headers on changed files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM \
            "origin/${{ github.base_ref }}"...HEAD \
            | grep -E '\.go$' || true)

          if [[ -z "$FILES" ]]; then
            echo "No source files changed — skipping copyright check."
            exit 0
          fi

          echo "Checking:"
          echo "$FILES"

          # The fixer exits 1 when it modifies files; capture that separately.
          echo "$FILES" | xargs python3 hack/add_copyright.py || true

          if ! git diff --quiet; then
            echo ""
            echo "::error::Missing copyright headers. Run the following and commit:"
            echo "  python3 hack/add_copyright.py <changed-files>"
            echo ""
            git diff
            exit 1
          fi

          echo "All copyright headers are present."

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm chart
        run: make helm-lint

      - name: Render Helm chart
        run: |
          make helm-template > /tmp/rendered.yaml
          grep -q -- '--controller-name=openeverest.io/monitoring-victoriametrics' /tmp/rendered.yaml \
            || { echo '::error::the controller is not told which controller name to claim classes by'; exit 1; }
          grep -A2 '^kind: MonitoringClass$' /tmp/rendered.yaml | grep -q '^  name: victoriametrics$' \
            || { echo '::error::the MonitoringClass is not named victoriametrics'; exit 1; }
          grep -q '^  controllerName: openeverest.io/monitoring-victoriametrics$' /tmp/rendered.yaml \
            || { echo '::error::the MonitoringClass does not name the controller'; exit 1; }

  test-integration:
    name: Integration / VMPodScrapes
    needs: [lint, build, test-unit, helm-lint]
    uses: ./.github/workflows/integration-test.yaml
    with:
      make_target: test-integration
      suite: vmpodscrapes
