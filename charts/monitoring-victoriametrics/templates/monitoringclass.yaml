{{- if .Values.class.create -}}
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: {{ .Values.class.name }}
  labels:
    {{- include "monitoring-victoriametrics.labels" . | nindent 4 }}
spec:
  controllerName: openeverest.io/monitoring-victoriametrics
  displayName: {{ .Values.class.displayName }}
  description: Sends metrics to a VMAgent managed by the VictoriaMetrics Operator, through one VMPodScrape per component of every bound Instance.
  extensionManaged:
    requires:
      metrics: true
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        vmPodScrapeLabels:
          type: object
          description: Labels put on the generated VMPodScrapes so the target VMAgent's podScrapeSelector selects them.
          additionalProperties:
            type: string
        interval:
          type: string
          description: Scrape interval, e.g. 30s. Defaults to the VMAgent's scrape interval.
          pattern: '^([0-9]+(ms|s|m|h|d|w|y))+$'
{{- end }}
