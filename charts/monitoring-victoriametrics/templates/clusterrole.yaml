{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-victoriametrics.fullname" . }}
  labels:
    {{- include "monitoring-victoriametrics.labels" . | nindent 4 }}
# A class controller reads the monitoring kinds, Instances and Providers and
# writes only monitoring status (spec 014 §4.6). It never writes Instances.
rules:
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses, monitoringdestinations, monitoringbindings]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses/status, monitoringdestinations/status, monitoringbindings/status]
    verbs: [get, patch, update]
  - apiGroups: [core.openeverest.io]
    resources: [instances, providers]
    verbs: [get, list, watch]
  # The objects this class controller renders for each binding.
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmpodscrapes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
{{- end }}
