replicaCount: 1

image:
  repository: ghcr.io/openeverest/monitoring-victoriametrics
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  automountServiceAccountToken: true
  name: ""

rbac:
  create: true

# The MonitoringClass this extension claims. The class is cluster-scoped and
# installed by this chart; destinations reference it by name.
class:
  create: true
  name: victoriametrics
  displayName: VictoriaMetrics (VictoriaMetrics Operator)

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: probes
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: probes
  initialDelaySeconds: 5
  periodSeconds: 10

leaderElection:
  enabled: true

logLevel: info

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
